[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-price-system"
version = "2.2.0"
description = "Explainable TDV-style gold, silver and copper research agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shadow Price System"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
contracts = ["pandera[pandas]>=0.20"]
openbb = ["openbb>=4"]
research = ["vectorbt>=0.28; python_version >= '3.11'"]
allocation = ["PyPortfolioOpt>=1.5"]
riskfolio = ["Riskfolio-Lib>=7"]
monitoring = ["evidently>=0.7"]
agent = ["mcp>=2,<3"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
tdv-metals = "tdv_metals.cli:main"
shadow-price-system = "tdv_metals.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
